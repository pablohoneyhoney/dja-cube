<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DJA Cube</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#141517; --fg:#e9e9e7; --muted:#8b8d92; --soft:#b9bbbf; --line:#2b2d31;
  --scene:#202226;
  --ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --rmono:"Roboto Mono",Menlo,Consolas,monospace;
  --w-hi:#8d939b; --w-mid:#50555c; --w-lo:#2c3035; --etch:#e3e7eb;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased;padding:0 16px 56px}
.page{max-width:640px;margin:0 auto}
header{padding:40px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:0}
header span{font-size:14px;color:var(--muted)}
nav{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:18px}
nav button{appearance:none;background:none;border:0;padding:12px 0;margin:0;font:inherit;font-size:15px;color:var(--muted);cursor:pointer;
  border-bottom:1px solid transparent;margin-bottom:-1px}
nav button:hover{color:var(--soft)}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
nav button:focus-visible{outline:1px solid var(--soft);outline-offset:4px}
nav button i{font-style:normal;color:var(--muted);margin-right:7px;font-variant-numeric:tabular-nums}
.panel[hidden]{display:none}

.scene{position:relative;width:100%;aspect-ratio:1/0.92;display:grid;place-items:center;overflow:hidden;
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 60% 52% at 50% 46%, var(--scene), rgba(32,34,38,0) 100%)}
.scene:active{cursor:grabbing}
.scene .floor{position:absolute;left:50%;top:70%;width:58%;height:14%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center, rgba(0,0,0,.5), rgba(0,0,0,0) 70%);filter:blur(7px);pointer-events:none}
.cube{--s:min(300px,58vw);position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;
  transform:rotateX(-26deg) rotateY(-34deg);will-change:transform}
.cube.snap{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.face{--mm:calc(var(--s) / 38.1);position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  background:
    radial-gradient(120% 90% at 18% 10%, rgba(255,255,255,.14), rgba(255,255,255,0) 55%),
    linear-gradient(145deg, var(--w-hi) 0%, var(--w-mid) 48%, var(--w-lo) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), inset 0 0 0 2px rgba(0,0,0,.25);
  backface-visibility:hidden;color:var(--etch);overflow:hidden}
.face::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--shade,0));pointer-events:none}
.face::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 30% 20%, rgba(255,255,255,var(--spec,0)), rgba(255,255,255,0) 70%);pointer-events:none}
.face>.art{position:relative;z-index:1;width:100%;height:100%;padding:calc(var(--mm)*3);display:grid;place-items:center;align-content:center;gap:calc(var(--mm)*1.2)}
.face>canvas.viz{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}
.f-front{transform:translateZ(calc(var(--s)/2))}
.f-back{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f-right{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.f-left{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f-top{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f-bottom{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.etch{color:#101216;text-shadow:0 calc(var(--mm)*.18) 0 rgba(255,255,255,.10);opacity:.94}
.face .mono{font-family:var(--rmono);text-transform:uppercase;letter-spacing:.1em;font-weight:500}
.nowrap{white-space:nowrap}
.art .stack{display:grid;gap:calc(var(--mm)*.9);justify-items:center}
.hallmark{position:absolute;left:calc(var(--mm)*3);bottom:calc(var(--mm)*3);text-align:left;display:grid;gap:calc(var(--mm)*.6)}

.views{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;font-size:13px;color:var(--muted);margin-top:4px}
.views button{appearance:none;background:none;border:0;padding:4px 0;margin:0;font:inherit;color:#5c5e63;cursor:pointer;text-transform:capitalize}
.views button:hover{color:var(--soft)}
.views button:focus-visible{outline:1px solid var(--soft);outline-offset:3px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;line-height:1.55;color:var(--muted);max-width:58ch}
@media (prefers-reduced-motion:reduce){.cube.snap{transition:none}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>DJA Cube</h1>
  </header>

  <nav role="tablist" aria-label="Concepts">
    <button type="button" role="tab" id="tab-sides" aria-selected="true" aria-controls="panel-sides" data-key="sides"><i>1</i>Twelve years</button>
    <button type="button" role="tab" id="tab-vault" aria-selected="false" aria-controls="panel-vault" data-key="vault"><i>2</i>The Vault</button>
    <button type="button" role="tab" id="tab-nameplate" aria-selected="false" aria-controls="panel-nameplate" data-key="nameplate"><i>3</i>E · R · I · C</button>
  </nav>

  <section class="panel" role="tabpanel" id="panel-sides" aria-labelledby="tab-sides">
    <div class="stage" data-concept="sides"></div>
  </section>

  <section class="panel" role="tabpanel" id="panel-vault" aria-labelledby="tab-vault" hidden>
    <div class="stage" data-concept="vault"></div>
  </section>

  <section class="panel" role="tabpanel" id="panel-nameplate" aria-labelledby="tab-nameplate" hidden>
    <div class="stage" data-concept="nameplate"></div>
  </section>

  <footer>All three drawn at real scale for a 1.5" (38.1 mm) polished tungsten cube, about 1.07 kg, as one natural dark etch into the metal. "Recipient Name" is a placeholder.</footer>
</div>

<script>
(function(){
  const CANVAS = (c,f)=>`<canvas class="viz" data-concept="${c}" data-face="${f}" aria-hidden="true"></canvas>`;

  /* Eric Binnion, public GitHub contributions per month, Jan 2014 .. Sep 2026 */
  const GH = [14,1,1,19,118,95,0,1,0,2,25,57, 48,79,147,166,56,141,43,268,202,53,274,355, 230,259,296,83,495,292,276,234,186,278,403,139, 160,54,61,41,53,11,93,77,86,121,75,45, 180,132,59,129,84,34,46,74,37,30,9,6, 17,48,35,17,31,25,2,0,0,36,31,40, 29,10,21,7,16,23,13,43,22,14,11,1, 12,14,26,27,4,13,1,1,14,14,22,21, 27,35,31,56,60,17,18,68,87,31,42,7, 6,77,27,12,30,6,187,48,14,1,4,1, 40,66,10,2,6,6,5,1,0,0,66,153, 1,8,6,0,9,5,171,62,65,80,140,38, 91,185,35,0,0,0,0,0,28];
  function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
  /* P2 placeholder series: a smooth, plausible shape, not real data */
  const P2 = (()=>{ const r=rng(7); const out=[]; let v=10; for(let i=0;i<GH.length;i++){ const yr=i/12; const hump=1+Math.exp(-Math.pow((yr-3.5)/2.2,2))*1.6; v=v*0.6+(8+r()*22)*0.4; out.push(Math.max(0,v*hump)); } return out; })();

  const concepts = {
    sides: {
      top: `<div class="art etch"><div class="stack" style="gap:calc(var(--mm)*1.3)"><div class="mono nowrap" style="font-size:calc(var(--mm)*2.6);font-weight:700">Eric Binnion</div><div class="mono nowrap" style="font-size:calc(var(--mm)*1.9);opacity:.85">2014 — 2026</div><div class="mono nowrap" style="font-size:calc(var(--mm)*1.8);line-height:1.7;opacity:.85">▲ 9 865 on GitHub<br>▼ 1 240 on P2</div></div></div>`,
      front: CANVAS('sides','front'), right: CANVAS('sides','right'), back: CANVAS('sides','back'), left: CANVAS('sides','left'),
      bottom: `<div class="art etch"><div class="stack" style="gap:calc(var(--mm)*1.3)"><div class="mono nowrap" style="font-size:calc(var(--mm)*2.4);font-weight:700">Recipient Name</div><div class="mono" style="font-size:calc(var(--mm)*1.9);opacity:.85;line-height:1.6">Distinguished<br>Janitor Award</div><div class="mono nowrap" style="font-size:calc(var(--mm)*1.9);opacity:.85">Nº 001 · 2026</div></div></div>`
    },
    vault: {
      top: CANVAS('vault','top'), front: CANVAS('vault','front'), right: CANVAS('vault','right'), back: CANVAS('vault','back'), left: CANVAS('vault','left'),
      bottom: `<div class="art etch"><div class="hallmark" style="gap:calc(var(--mm)*.9)"><div class="mono nowrap" style="font-size:calc(var(--mm)*2.2);font-weight:700">Recipient Name</div><div class="mono nowrap" style="font-size:calc(var(--mm)*1.9);opacity:.85">Distinguished Janitor</div><div class="mono nowrap" style="font-size:calc(var(--mm)*1.9);opacity:.85">Nº 001 · 2026</div></div></div>`
    },
    nameplate: {
      top: `<div class="art etch"><div class="stack" style="gap:calc(var(--mm)*1.4)"><div class="mono" style="font-size:calc(var(--mm)*1.9);opacity:.85;line-height:1.6">Distinguished<br>Janitor Award</div><div class="mono nowrap" style="font-size:calc(var(--mm)*2.5);font-weight:700">Recipient Name</div></div></div>`,
      front: CANVAS('letters','front'), right: CANVAS('letters','right'), back: CANVAS('letters','back'), left: CANVAS('letters','left'),
      bottom: `<div class="art etch"><div class="stack" style="gap:calc(var(--mm)*1.4)"><div class="mono nowrap" style="font-size:calc(var(--mm)*2.2);font-weight:700">Nº 001 · 2026</div><div class="mono nowrap" style="font-size:calc(var(--mm)*1.9);opacity:.85">Chosen by Eric Binnion</div><div class="mono nowrap" style="font-size:calc(var(--mm)*1.8);opacity:.75">Automattic · 2011 →</div></div></div>`
    }
  };

  const ORDER = ['top','front','right','back','left','bottom'];
  const NORMALS = {front:[0,0,1],back:[0,0,-1],right:[1,0,0],left:[-1,0,0],top:[0,-1,0],bottom:[0,1,0]};
  const VIEWS = {top:[-90,0],front:[0,0],right:[0,-90],back:[0,180],left:[0,90],bottom:[90,0]};
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ETCH = '16,18,22';

  /* Face-local coordinates for a point on the cube surface, matching the CSS face transforms. */
  function toFace(face, v){
    const [x,y,z]=v;
    switch(face){
      case 'front':  return z>0 ? [ x/z,  y/z] : null;
      case 'back':   return z<0 ? [ x/z,  -y/z] : null;
      case 'right':  return x>0 ? [-z/x,  y/x] : null;
      case 'left':   return x<0 ? [-z/x, -y/x] : null;
      case 'top':    return y<0 ? [-x/y, -z/y] : null;
      case 'bottom': return y>0 ? [ x/y, -z/y] : null;
    }
  }
  function faceOf(v){ const [x,y,z]=v, ax=Math.abs(x), ay=Math.abs(y), az=Math.abs(z);
    if(ax>=ay && ax>=az) return x>0?'right':'left'; if(ay>=az) return y>0?'bottom':'top'; return z>0?'front':'back'; }
  function norm(v){const l=Math.hypot(...v)||1;return v.map(x=>x/l)}
  function slerp(a,b,t){ const d=Math.max(-1,Math.min(1,a[0]*b[0]+a[1]*b[1]+a[2]*b[2])); const th=Math.acos(d); if(th<1e-4) return a;
    const s=Math.sin(th), wa=Math.sin((1-t)*th)/s, wb=Math.sin(t*th)/s; return [a[0]*wa+b[0]*wb,a[1]*wa+b[1]*wb,a[2]*wa+b[2]*wb]; }

  /* Graph on a sphere: clustered nodes, bottom cap left empty for the hallmark */
  const GRAPH = (()=>{
    const r=rng(2026); const nodes=[], edges=[];
    const centers=[]; let k=0; while(centers.length<11){ const ang=(k++/11)*Math.PI*2 + r()*0.5; const y=-0.55+r()*0.75; const rad=Math.sqrt(Math.max(0.05,1-y*y)); centers.push(norm([Math.cos(ang)*rad, y, Math.sin(ang)*rad])); }
    centers.forEach((c,ci)=>{ const n=18+Math.floor(r()*22); const spread=0.2+r()*0.16;
      for(let i=0;i<n;i++){ let v; do{ v=norm([c[0]+(r()*2-1)*spread*1.6,c[1]+(r()*2-1)*spread*1.6,c[2]+(r()*2-1)*spread*1.6]); }while(v[1]>0.5); nodes.push({v,c:ci,deg:0}); } });
    const byC={}; nodes.forEach((n,i)=>{(byC[n.c]??=[]).push(i)});
    const link=(a,b)=>{ if(a===b) return; edges.push([a,b]); nodes[a].deg++; nodes[b].deg++; };
    for(const ci in byC){ const ids=byC[ci]; const hub=ids[0];
      ids.forEach((id,k)=>{ if(k===0) return; if(r()<0.55) link(id,hub);
        let best=-1,bd=9; for(const j of ids){ if(j===id) continue; const d=Math.hypot(nodes[id].v[0]-nodes[j].v[0],nodes[id].v[1]-nodes[j].v[1],nodes[id].v[2]-nodes[j].v[2]); if(d<bd){bd=d;best=j;} } if(best>=0) link(id,best);
        if(r()<0.25) link(id, ids[Math.floor(r()*ids.length)]); });
    }
    const hubs=Object.values(byC).map(ids=>ids[0]);
    for(let i=0;i<hubs.length;i++){ link(hubs[i],hubs[(i+1)%hubs.length]); if(r()<0.6) link(hubs[i],hubs[Math.floor(r()*hubs.length)]); }
    for(let k=0;k<18;k++){ link(Math.floor(r()*nodes.length), Math.floor(r()*nodes.length)); }
    return {nodes,edges};
  })();

  function drawVault(face, cv){
    const dpr=Math.min(2,devicePixelRatio||1), S=cv.clientWidth; if(!S) return;
    cv.width=S*dpr; cv.height=S*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,S,S);
    const mm=S/38.1, half=S/2; const px=(l)=>[half+l[0]*half, half+l[1]*half];
    g.strokeStyle=`rgba(${ETCH},.7)`; g.lineWidth=Math.max(0.6,0.18*mm); g.lineCap='round';
    const STEPS=14;
    for(const [a,b] of GRAPH.edges){ const va=GRAPH.nodes[a].v, vb=GRAPH.nodes[b].v;
      let prev=slerp(va,vb,0), prevFace=faceOf(prev);
      for(let s=1;s<=STEPS;s++){ const cur=slerp(va,vb,s/STEPS), curFace=faceOf(cur);
        const facesToDraw = curFace===prevFace ? [curFace] : [prevFace,curFace];
        if(facesToDraw.includes(face)){ const p=toFace(face,prev), q=toFace(face,cur); if(p&&q){ const [x1,y1]=px(p),[x2,y2]=px(q); g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); } }
        prev=cur; prevFace=curFace; }
    }
    g.fillStyle=`rgba(${ETCH},.95)`;
    for(const n of GRAPH.nodes){ if(faceOf(n.v)!==face) continue; const l=toFace(face,n.v); if(!l) continue; const [x,y]=px(l);
      const rad=(0.35+Math.min(0.55,n.deg*0.07))*mm/2; g.beginPath(); g.arc(x,y,Math.max(0.8,rad),0,Math.PI*2); g.fill(); }
  }

  function drawSides(face, cv){
    const dpr=Math.min(2,devicePixelRatio||1), S=cv.clientWidth; if(!S) return;
    cv.width=S*dpr; cv.height=S*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,S,S);
    const mm=S/38.1, idx={front:0,right:1,back:2,left:3}[face]; if(idx===undefined) return;
    const N=GH.length, perFace=N/4, pitch=S/perFace, barW=pitch*0.65;
    const base=S*0.56, upMax=S*0.50, dnMax=S*0.38;
    const ghMax=Math.sqrt(Math.max(...GH)), p2Max=Math.sqrt(Math.max(...P2));
    g.fillStyle=`rgba(${ETCH},.75)`; g.fillRect(0, base-Math.max(0.5,0.12*mm), S, Math.max(1,0.24*mm));
    const start=idx*perFace, end=start+perFace;
    const first=Math.floor(start), last=Math.ceil(end);
    for(let m=first;m<last && m<N;m++){
      const x=(m-start)*pitch; if(x+barW<0||x>S) continue;
      const hu=Math.sqrt(GH[m])/ghMax*upMax, hd=Math.sqrt(P2[m])/p2Max*dnMax;
      g.fillStyle=`rgba(${ETCH},.92)`; if(hu>0) g.fillRect(x+(pitch-barW)/2, base-hu, barW, hu);
      g.fillStyle=`rgba(${ETCH},.6)`; if(hd>0) g.fillRect(x+(pitch-barW)/2, base+Math.max(1,0.3*mm), barW, hd);
      if(m===49){ g.fillStyle=`rgba(${ETCH},.9)`; const cx=x+pitch/2, ty=base-hu-1.2*mm; g.beginPath(); g.moveTo(cx,ty); g.lineTo(cx-0.6*mm,ty-1.1*mm); g.lineTo(cx+0.6*mm,ty-1.1*mm); g.closePath(); g.fill();
        g.font=`500 ${1.9*mm}px "Roboto Mono", Menlo, monospace`; g.textBaseline='bottom'; g.textAlign='center'; g.fillText('DJA', cx, ty-1.6*mm); }
    }
  }
  const LETTERS={front:'E',right:'R',back:'I',left:'C'};
  function drawLetters(face, cv){
    const ch=LETTERS[face]; if(!ch) return;
    const dpr=Math.min(2,devicePixelRatio||1), S=cv.clientWidth; if(!S) return;
    cv.width=S*dpr; cv.height=S*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,S,S);
    const mm=S/38.1;
    g.font=`700 ${36*mm}px "Roboto Mono", Menlo, monospace`; g.textBaseline='alphabetic'; g.textAlign='left';
    const m=g.measureText(ch);
    const w=m.actualBoundingBoxRight+m.actualBoundingBoxLeft, h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
    const x=S/2 - w/2 + m.actualBoundingBoxLeft;
    const y=S/2 + h/2 - m.actualBoundingBoxDescent;
    g.fillStyle='rgba(255,255,255,.10)'; g.fillText(ch, x, y+0.18*mm);
    g.fillStyle=`rgba(${ETCH},.94)`; g.fillText(ch, x, y);
  }
  const DRAW={vault:drawVault, sides:drawSides, letters:drawLetters};
  function drawAll(){ document.querySelectorAll('canvas.viz').forEach(cv=>{ const fn=DRAW[cv.dataset.concept]; if(fn) fn(cv.dataset.face, cv); }); }

  function faceEl(name, html){ const d=document.createElement('div'); d.className='face f-'+name; d.innerHTML=html; return d; }
  const L = norm([-0.45,-0.8,0.6]);
  const H = norm([L[0],L[1],L[2]+1]);
  function shade(cube, rx, ry){
    const ax=rx*Math.PI/180, ay=ry*Math.PI/180;
    const cx=Math.cos(ax), sx=Math.sin(ax), cy=Math.cos(ay), sy=Math.sin(ay);
    for(const name of ORDER){
      const [x,y,z]=NORMALS[name];
      const x1 = x*cy + z*sy, z1 = -x*sy + z*cy, y1 = y;
      const y2 = y1*cx - z1*sx, z2 = y1*sx + z1*cx, x2 = x1;
      const diff = Math.max(0, x2*L[0]+y2*L[1]+z2*L[2]);
      const spec = Math.pow(Math.max(0, x2*H[0]+y2*H[1]+z2*H[2]), 14);
      const el = cube.querySelector('.f-'+name);
      el.style.setProperty('--shade', (0.55*(1-diff)).toFixed(3));
      el.style.setProperty('--spec', (0.28*spec).toFixed(3));
    }
  }

  document.querySelectorAll('.stage').forEach(stage=>{
    const key = stage.dataset.concept, faces = concepts[key];
    const scene=document.createElement('div'); scene.className='scene';
    const floor=document.createElement('div'); floor.className='floor';
    const cube=document.createElement('div'); cube.className='cube';
    for(const n of ORDER) cube.appendChild(faceEl(n, faces[n]));
    scene.append(floor, cube); stage.appendChild(scene);

    const views=document.createElement('div'); views.className='views';
    for(const n of ORDER){ const b=document.createElement('button'); b.type='button'; b.textContent=n; b.dataset.view=n; views.appendChild(b); }
    stage.appendChild(views);

    let rx=-26, ry=-34, idle=true, dragging=false, px=0, py=0;
    const apply=()=>{ cube.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`; shade(cube,rx,ry); };
    apply();
    scene.addEventListener('pointerdown',e=>{dragging=true; idle=false; cube.classList.remove('snap'); px=e.clientX; py=e.clientY; scene.setPointerCapture(e.pointerId);});
    scene.addEventListener('pointermove',e=>{ if(!dragging) return; ry += (e.clientX-px)*0.5; rx -= (e.clientY-py)*0.5; rx=Math.max(-90,Math.min(90,rx)); px=e.clientX; py=e.clientY; apply(); });
    const up=()=>{dragging=false;};
    scene.addEventListener('pointerup',up); scene.addEventListener('pointercancel',up);
    views.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; idle=false; const [vx,vy]=VIEWS[b.dataset.view]; cube.classList.add('snap'); rx=vx; ry=vy; apply(); });
    if(!reduce){
      const tick=()=>{ if(idle && !dragging){ ry+=0.12; apply(); } requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
      scene.addEventListener('dblclick',()=>{ idle=true; cube.classList.remove('snap'); });
    }
  });

  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(drawAll); drawAll(); window.__drawAll=drawAll;
  let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(drawAll,150); });

  /* tabs */
  const tabs=[...document.querySelectorAll('nav [role=tab]')];
  function show(key){
    tabs.forEach(t=>t.setAttribute('aria-selected', String(t.dataset.key===key)));
    document.querySelectorAll('.panel').forEach(p=>{ p.hidden = p.id!=='panel-'+key; });
    requestAnimationFrame(drawAll);
    if(history.replaceState) history.replaceState(null,'','#'+key);
  }
  tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.key)));
  const hash=(location.hash||'').replace('#','');
  if(['sides','vault','nameplate'].includes(hash)) show(hash);
})();
</script>
</body>
</html>
